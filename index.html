<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Little Surprise for Avni</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Work+Sans:wght@400;500;600;700&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF3EA; --paper:#FFFDF8; --blush:#F5DCE3; --rose:#EFC7D1;
    --ink:#4A2E39; --wine:#8C3B54; --wine-deep:#6E2A41;
    --gold:#B8863A; --gold-light:#E9CB86;
    --shadow:rgba(110,42,65,.30);
    --font-display:'Cormorant Garamond', Georgia, serif;
    --font-body:'Work Sans', 'Segoe UI', sans-serif;
    --font-script:'Mrs Saint Delafield', cursive;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;min-height:100%;overflow-x:hidden;font-family:var(--font-body), sans-serif;}
  body{
    background:
      radial-gradient(circle at 14% 18%, rgba(233,203,134,.30), transparent 42%),
      radial-gradient(circle at 86% 82%, rgba(239,199,209,.45), transparent 48%),
      linear-gradient(135deg,var(--cream),var(--blush),var(--cream));
    background-size:200% 200%, 200% 200%, 300% 300%;
    animation:bgshift 24s ease infinite;
    min-height:100vh; display:flex; align-items:center; justify-content:center; color:var(--ink);
    position:relative;
  }
  @keyframes bgshift{0%{background-position:0% 50%,0% 50%,0% 50%}50%{background-position:100% 50%,100% 50%,100% 50%}100%{background-position:0% 50%,0% 50%,0% 50%}}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001s !important; animation-iteration-count:1 !important; transition-duration:.001s !important;}
  }

  /* ---- ambient botanical watermarks ---- */
  .ambient{position:fixed; width:320px; height:320px; color:var(--gold); opacity:.10; pointer-events:none; z-index:0;}
  .ambient.a1{top:-70px; left:-80px;}
  .ambient.a2{bottom:-90px; right:-80px; transform:rotate(180deg);}
  @keyframes driftA{0%,100%{transform:translateY(0) rotate(18deg)}50%{transform:translateY(-16px) rotate(22deg)}}
  @keyframes driftB{0%,100%{transform:translateY(0) rotate(196deg)}50%{transform:translateY(14px) rotate(200deg)}}
  .ambient.a1{animation:driftA 14s ease-in-out infinite;}
  .ambient.a2{animation:driftB 16s ease-in-out infinite;}

  .screen{display:none; width:100%; max-width:480px; min-height:100vh;
    padding:32px 20px calc(32px + env(safe-area-inset-bottom,0px));
    padding-top:calc(32px + env(safe-area-inset-top,0px));
    flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:20px;
    position:relative; z-index:2;}
  .screen.active{display:flex; animation:fadeIn .7s cubic-bezier(.2,.8,.2,1);}
  @keyframes fadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

  .card{background:rgba(255,253,248,.88); backdrop-filter:blur(14px);
    border:1px solid rgba(184,134,58,.28); border-radius:6px 28px 6px 28px;
    padding:38px 26px; box-shadow:0 26px 60px -26px var(--shadow), inset 0 1px 0 rgba(255,255,255,.6);
    width:100%; position:relative;}
  .card::before{content:''; position:absolute; inset:10px; border:1px solid rgba(184,134,58,.18);
    border-radius:4px 22px 4px 22px; pointer-events:none;}
  .screen.active .card{animation:cardIn .7s cubic-bezier(.2,.8,.2,1) .05s both;}
  @keyframes cardIn{from{opacity:0; transform:translateY(10px) scale(.97);}to{opacity:1; transform:translateY(0) scale(1);}}

  .corner-flourish{position:absolute; width:44px; height:44px; color:var(--gold); opacity:0; pointer-events:none; z-index:1;}
  .corner-flourish.tl{top:16px; left:16px; transform:scaleX(-1);}
  .corner-flourish.br{bottom:16px; right:16px; transform:rotate(180deg);}
  .screen.active .corner-flourish{animation:flourishFade 1.1s ease .1s both;}
  .screen.active .corner-flourish.br{animation-delay:.3s;}
  @keyframes flourishFade{from{opacity:0}to{opacity:.55}}

  .eyebrow{font-family:var(--font-display); font-style:italic; font-weight:500; font-size:1rem;
    color:var(--wine); opacity:.85; margin-bottom:2px; display:flex; align-items:center;
    justify-content:center; gap:10px; letter-spacing:.01em; position:relative; z-index:1;}
  .eyebrow::before,.eyebrow::after{content:''; width:22px; height:1px; background:linear-gradient(90deg,transparent,var(--gold));}
  .eyebrow::after{background:linear-gradient(90deg,var(--gold),transparent);}

  h1{font-family:var(--font-display); font-style:italic; font-weight:600; font-size:1.85rem;
    margin:0 0 8px; color:var(--wine-deep); line-height:1.3; position:relative; z-index:1;}
  h2{font-family:var(--font-display); font-style:italic; font-weight:600; font-size:1.5rem;
    margin:0 0 10px; line-height:1.35; color:var(--wine-deep); position:relative; z-index:1;}
  p{line-height:1.7; font-size:1rem; color:var(--ink); position:relative; z-index:1;}
  .sub{opacity:.78; font-size:.97rem;}
  .dots{display:flex;gap:7px;justify-content:center;margin-bottom:6px; position:relative; z-index:1;}
  .dots span{width:6px;height:6px;border-radius:50%;background:rgba(184,134,58,.28); transition:all .35s ease;}
  .dots span.on{background:var(--wine); width:18px; border-radius:5px;}

  .divider{width:74px;height:1px;margin:2px auto 16px; position:relative;
    background:linear-gradient(90deg,transparent,var(--gold),var(--gold-light),var(--gold),transparent);
    background-size:220% 100%; animation:shimmer 3.4s ease-in-out infinite;}
  @keyframes shimmer{0%,100%{background-position:0% 0}50%{background-position:100% 0}}
  .divider::after{content:'❀'; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    font-size:.78rem; color:var(--gold); background:var(--paper); padding:0 8px;}

  .btn{font-family:var(--font-body); border:none;border-radius:12px;padding:16px 28px;font-size:1rem;
    font-weight:600;cursor:pointer;min-height:52px;min-width:130px;
    background:linear-gradient(135deg,var(--wine),var(--wine-deep));color:#fff;letter-spacing:.01em;
    box-shadow:0 12px 26px -10px var(--shadow), inset 0 1px 0 rgba(255,255,255,.25);
    transition:transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s;
    position:relative; z-index:1; overflow:hidden;}
  .btn::after{content:''; position:absolute; top:0; left:-60%; width:40%; height:100%;
    background:linear-gradient(120deg,transparent,rgba(255,255,255,.4),transparent);
    transform:skewX(-20deg); transition:left .6s ease;}
  .btn:hover::after{left:120%;}
  .btn:hover{transform:translateY(-2px); box-shadow:0 16px 32px -10px var(--shadow), inset 0 1px 0 rgba(255,255,255,.3);}
  .btn:active{transform:translateY(0) scale(.96);}
  .btn:focus-visible{outline:2px solid var(--wine); outline-offset:3px;}
  .btn.secondary{background:var(--paper);color:var(--wine);border:1.4px solid var(--gold);box-shadow:0 6px 16px -10px var(--shadow);}
  .btn.secondary:hover{background:var(--blush);}
  .btn.grow{animation:pulse 1.3s ease infinite;}
  @keyframes pulse{0%,100%{transform:scale(var(--base-scale,1))}50%{transform:scale(calc(var(--base-scale,1) * 1.06))}}
  .btn.wobble{animation:wobble .4s ease;}
  @keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}

  .choice-row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;position:relative;min-height:70px;width:100%;}
  .no-fixed [data-dodge]{position:absolute;z-index:50;}
  [data-dodge]{transition:transform .35s cubic-bezier(.34,1.56,.64,1);}

  .sticker{font-size:2.1rem;
    animation:popIn .5s cubic-bezier(.34,1.56,.64,1), breathe 3.2s ease-in-out .6s infinite;
    filter:drop-shadow(0 6px 10px rgba(140,59,84,.25)); position:relative; z-index:1;}
  @keyframes popIn{from{transform:scale(0) rotate(-15deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

  .particles{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5;}
  .p{position:absolute;font-size:1.4rem;opacity:0;animation:floatUp 2.6s ease forwards;
    filter:drop-shadow(0 4px 8px rgba(140,59,84,.2));}
  @keyframes floatUp{0%{opacity:0;transform:translateY(0) scale(.5)}15%{opacity:1}100%{opacity:0;transform:translateY(-160px) scale(1.1)}}

  #countdown{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0; position:relative; z-index:1;}
  .cbox{background:var(--paper); border:1px solid rgba(184,134,58,.32); border-radius:12px;
    padding:14px 12px;min-width:68px;box-shadow:0 12px 24px -14px var(--shadow);}
  .cbox .num{font-family:var(--font-display); font-style:italic; font-weight:600; font-size:1.9rem; color:var(--wine);}
  .cbox .lbl{font-size:.7rem; letter-spacing:.05em; opacity:.65; color:var(--ink);}

  .photowall{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;justify-items:center;margin-top:8px; position:relative; z-index:1;}
  .polaroid{background:var(--paper); padding:10px 10px 24px; border-radius:3px;
    box-shadow:0 16px 30px -12px rgba(74,46,57,.3); width:100%; max-width:172px; border:1px solid rgba(184,134,58,.25);
    animation:floaty 4.5s ease-in-out infinite;}
  .polaroid img{width:100%;height:160px;object-fit:cover;border-radius:2px;
    background:radial-gradient(circle at 50% 35%,var(--blush),var(--cream));}
  .polaroid .cap{font-family:var(--font-display); font-style:italic; font-size:.86rem; margin-top:8px; color:var(--wine);}
  .polaroid:nth-child(odd){transform:rotate(-4deg);}
  .polaroid:nth-child(even){transform:rotate(3deg);animation-delay:.5s;}
  #screen-photos{gap:14px;}
  #screen-photos .card{padding:26px 20px 22px;}
  #screen-photos h2{margin-bottom:4px;}
  #screen-photos .photowall{margin-top:2px;margin-bottom:2px;}
  @keyframes floaty{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-8px) rotate(var(--r,0deg))}}

  .envelope{width:172px;height:116px;margin:12px auto;position:relative;cursor:pointer; z-index:1;
    transition:transform .3s ease;}
  .envelope:hover{transform:translateY(-3px);}
  .envelope .body{position:absolute;inset:0;background:linear-gradient(160deg,var(--paper),var(--blush));
    border-radius:6px;box-shadow:0 18px 34px -12px var(--shadow); border:1px solid rgba(184,134,58,.32);}
  .envelope .flap{position:absolute;top:0;left:0;width:100%;height:56%;
    background:linear-gradient(160deg,var(--wine),var(--wine-deep));
    clip-path:polygon(0 0,100% 0,50% 100%);border-radius:6px 6px 0 0;
    transform-origin:top;transition:transform .7s cubic-bezier(.4,.2,.2,1); z-index:2;}
  .envelope .seal{position:absolute; top:50%; left:50%; width:32px; height:32px;
    background:radial-gradient(circle at 35% 30%,var(--gold-light),var(--gold));
    border-radius:50%; transform:translate(-50%,-50%); box-shadow:0 5px 12px rgba(0,0,0,.28); z-index:3;
    display:flex; align-items:center; justify-content:center; font-family:var(--font-script);
    color:var(--wine-deep); font-size:1.15rem; transition:opacity .4s ease, transform .4s ease;}
  .envelope.open .flap{transform:rotateX(180deg);}
  .envelope.open .seal{opacity:0; transform:translate(-50%,-50%) scale(.4);}
  .letter-paper{background:var(--paper); border-radius:4px; padding:30px 24px; margin-top:16px;
    box-shadow:0 16px 36px -16px rgba(74,46,57,.32); border:1px solid rgba(184,134,58,.25);
    transform:translateY(30px) rotateX(-8deg); transform-origin:top center; opacity:0;
    transition:all .8s cubic-bezier(.2,.8,.2,1); position:relative; z-index:1;}
  .letter-paper.show{transform:translateY(0) rotateX(0);opacity:1;}
  #letterSig{text-align:right; font-family:var(--font-script); font-size:1.4rem; color:var(--wine); margin-top:4px;}

  #finalTitle{font-family:var(--font-script); font-weight:400; font-size:2.6rem; color:var(--wine-deep);
    line-height:1.15; margin-bottom:4px;}

  .love-reveal{font-family:var(--font-display); font-style:italic; font-weight:600; font-size:1.35rem;
    color:var(--wine-deep); margin-top:2px; opacity:0; transform:translateY(12px) scale(.94);
    text-shadow:0 0 22px rgba(184,134,58,.35);
    transition:opacity .8s cubic-bezier(.2,.8,.2,1), transform .8s cubic-bezier(.2,.8,.2,1);}
  .love-reveal.show{opacity:1; transform:translateY(0) scale(1); animation:loveGlow 2.4s ease-in-out .8s infinite;}
  @keyframes loveGlow{0%,100%{text-shadow:0 0 18px rgba(184,134,58,.28);}50%{text-shadow:0 0 30px rgba(184,134,58,.55);}}

  .mute-btn{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;z-index:60;
    background:rgba(255,253,248,.82); border:1.4px solid rgba(184,134,58,.4); backdrop-filter:blur(8px);
    border-radius:50%;width:46px;height:46px;font-size:1.15rem;cursor:pointer;
    box-shadow:0 6px 16px -6px var(--shadow); transition:transform .2s;}
  .mute-btn:hover{transform:scale(1.06);}
  .mute-btn:focus-visible{outline:2px solid var(--wine);}

  @media (max-width:360px){ h1{font-size:1.55rem;} h2{font-size:1.3rem;} #finalTitle{font-size:2.1rem;} .btn{padding:14px 20px;font-size:.95rem;} }
</style>
</head>
<body>

<div class="screen active" id="screen-opening">
  <div class="card">
    <svg class="corner-flourish tl" aria-hidden="true"><use href="#sprig"/></svg>
    <svg class="corner-flourish br" aria-hidden="true"><use href="#sprig"/></svg>
    <div class="dots"><span class="on"></span><span></span><span></span><span></span><span></span><span></span></div>
    <div class="eyebrow">a little something, just for you</div>
    <div class="sticker">🎀</div>
    <h1 id="openTitle"></h1>
    <p class="sub" id="openSub"></p>
    <button class="btn" onclick="startExperience()" id="startBtn"></button>
  </div>
</div>

<div class="screen" id="screen-q1">
  <div class="card">
    <svg class="corner-flourish tl" aria-hidden="true"><use href="#sprig"/></svg>
    <svg class="corner-flourish br" aria-hidden="true"><use href="#sprig"/></svg>
    <div class="dots"><span></span><span class="on"></span><span></span><span></span><span></span><span></span></div>
    <div class="eyebrow">question one of two</div>
    <div class="sticker" id="q1Sticker">😂</div>
    <h2 id="q1Text"></h2>
    <div class="choice-row" id="q1Row">
      <button class="btn" id="yesBtn" onclick="onYes1()"></button>
      <button class="btn secondary" id="noBtn" data-dodge onclick="onNo1(event)" ontouchstart="onNo1(event)"></button>
    </div>
  </div>
</div>

<div class="screen" id="screen-q2">
  <div class="card">
    <svg class="corner-flourish tl" aria-hidden="true"><use href="#sprig"/></svg>
    <svg class="corner-flourish br" aria-hidden="true"><use href="#sprig"/></svg>
    <div class="dots"><span></span><span></span><span class="on"></span><span></span><span></span><span></span></div>
    <div class="eyebrow">question two of two</div>
    <div class="sticker" id="q2Sticker">🫶</div>
    <h2 id="q2Text"></h2>
    <div id="q2Reaction" aria-live="polite"></div>
    <div class="choice-row" id="q2Row">
      <button class="btn" id="loverBtn" onclick="onLover()"></button>
      <button class="btn secondary" id="friendBtn" data-dodge onclick="onFriend(event)" ontouchstart="onFriend(event)"></button>
    </div>
  </div>
</div>

<div class="screen" id="screen-transition">
  <div class="card">
    <svg class="corner-flourish tl" aria-hidden="true"><use href="#sprig"/></svg>
    <svg class="corner-flourish br" aria-hidden="true"><use href="#sprig"/></svg>
    <div class="sticker">🌸</div>
    <h2 id="loverReaction1"></h2>
    <p id="loveYouToo" class="love-reveal"></p>
    <p id="birthdayIntro" style="display:none"></p>
    <button class="btn" id="showMeBtn" onclick="revealBirthday()" style="display:none"></button>
  </div>
</div>

<div class="screen" id="screen-birthday">
  <div class="card">
    <svg class="corner-flourish tl" aria-hidden="true"><use href="#sprig"/></svg>
    <svg class="corner-flourish br" aria-hidden="true"><use href="#sprig"/></svg>
    <div class="dots"><span></span><span></span><span></span><span class="on"></span><span></span><span></span></div>
    <div class="eyebrow">the real reason</div>
    <h1 id="bDateText"></h1>
    <h2 id="bTitle"></h2>
    <div id="countdown">
      <div class="cbox"><div class="num" id="cd-d">0</div><div class="lbl">days</div></div>
      <div class="cbox"><div class="num" id="cd-h">0</div><div class="lbl">hrs</div></div>
      <div class="cbox"><div class="num" id="cd-m">0</div><div class="lbl">min</div></div>
      <div class="cbox"><div class="num" id="cd-s">0</div><div class="lbl">sec</div></div>
    </div>

</div>

<div class="screen" id="screen-photos">
  <div class="card">
    <svg class="corner-flourish tl" aria-hidden="true"><use href="#sprig"/></svg>
    <svg class="corner-flourish br" aria-hidden="true"><use href="#sprig"/></svg>
    <div class="dots"><span></span><span></span><span></span><span></span><span class="on"></span><span></span></div>
    <div class="eyebrow">some favorites</div>
    <h2>a little memory wall 🌷</h2>
    <div class="photowall" id="photowall"></div>
    <button class="btn" onclick="showScreen('screen-letter')">Continue →</button>
  </div>
</div>

<div class="screen" id="screen-letter">
  <div class="card">
    <svg class="corner-flourish tl" aria-hidden="true"><use href="#sprig"/></svg>
    <svg class="corner-flourish br" aria-hidden="true"><use href="#sprig"/></svg>
    <div class="dots"><span></span><span></span><span></span><span></span><span></span><span class="on"></span></div>
    <div class="eyebrow">last stop</div>
    <p id="letterIntro"></p>
    <div class="envelope" id="envelope" onclick="openLetter()" role="button" tabindex="0" aria-label="Open letter"></div>
    <button class="btn" id="openLetterBtn" onclick="openLetter()"></button>

      <h2 id="letterOpenedTitle"></h2>
      <div class="divider"></div>
      <p id="letterBody"></p>
      <p id="letterSig"></p>
      <button class="btn" onclick="showScreen('screen-final')" style="margin-top:12px">Continue →</button>

<div class="screen" id="screen-final">
  <div class="card">
    <svg class="corner-flourish tl" aria-hidden="true"><use href="#sprig"/></svg>
    <svg class="corner-flourish br" aria-hidden="true"><use href="#sprig"/></svg>
    <h1 id="finalTitle"></h1>
    <div class="divider"></div>
    <p id="finalLine"></p>
    <button class="btn" onclick="restart()" id="replayBtn"></button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const C = BIRTHDAY_CONFIG;

document.querySelector('#envelope').innerHTML = '<div class="body"></div><div class="flap"></div><div class="seal">S</div>';
document.querySelector('#envelope').addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' ') openLetter(); });

$('openTitle').textContent=C.openingTitle; $('openSub').textContent=C.openingSubtitle; $('startBtn').textContent=C.startBtn;
$('q1Text').textContent=C.question1; $('yesBtn').textContent=C.question1Yes; $('noBtn').textContent=C.q1NoSequence[0];
$('q2Text').textContent=C.question2; $('loverBtn').textContent=C.question2Lover; $('friendBtn').textContent=C.q2FriendSequence[0];
$('loverReaction1').textContent=C.loverReaction1; $('loveYouToo').textContent=C.loveYouTooText; $('birthdayIntro').textContent=C.birthdayIntro; $('showMeBtn').textContent=C.showMeBtn;
$('bDateText').textContent=C.birthdayDateText; $('bTitle').textContent=C.birthdayTitle; $('bArrived').textContent=C.birthdayArrivedText;
$('letterIntro').textContent=C.letterIntro; $('openLetterBtn').textContent=C.openLetterBtn;
$('letterOpenedTitle').textContent=C.letterOpenedTitle; $('letterBody').textContent=C.letterBody; $('letterSig').textContent=C.letterSignature;
$('finalTitle').textContent=C.finalTitle; $('finalLine').textContent=C.finalLine; $('replayBtn').textContent=C.replayBtn;

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $(id).classList.add('active'); window.scrollTo(0,0);
}
function burst(emojis, count=10){
  const layer=$('particles');
  for(let i=0;i<count;i++){
    const el=document.createElement('div'); el.className='p';
    el.textContent=emojis[Math.floor(Math.random()*emojis.length)];
    el.style.left=(Math.random()*90+5)+'vw'; el.style.bottom=(Math.random()*20)+'vh';
    el.style.animationDelay=(Math.random()*.3)+'s';
    layer.appendChild(el); setTimeout(()=>el.remove(),3000);
  }
}

// ---- music ----
let musicStarted=false, musicOn=false;
function ensureMusicStarted(){
  if(musicStarted) return;
  musicStarted=true;
  const a=$('bgm'); a.src=C.musicFile; a.volume=0;
  a.play().then(()=>{
    musicOn=true;
    let v=0; const fade=setInterval(()=>{ v+=0.05; a.volume=Math.min(v,0.5); if(v>=0.5) clearInterval(fade); },100);
  }).catch(()=>{ musicStarted=false; }); // browser blocked it silently — retry on the next tap/interaction
}
function startExperience(){
  burst(['💗','✨','🎀'],14);
  ensureMusicStarted();
  setTimeout(()=>showScreen('screen-q1'),500);
}
// try to play the moment the page loads; if the browser blocks silent autoplay,
// this quietly starts the music on the very first tap/click/key anywhere on the
// page — the user never has to find and press the speaker button on purpose.
document.addEventListener('DOMContentLoaded', ensureMusicStarted);
['pointerdown','touchstart','click','keydown'].forEach(evt=>document.addEventListener(evt, ensureMusicStarted));

// ---- reusable dodge/move system ----
// The button becomes position:absolute *inside the card* (not position:fixed —
// the card's entry animation leaves a lingering CSS transform on it, and a
// transformed ancestor silently turns position:fixed into "relative to that
// ancestor", which was causing the button to land in the wrong spot). All the
// math below is in coordinates relative to the card's own top-left corner, so
// it never depends on scroll position or on how the card itself is positioned.
function playfulMove(btn){
  const row=btn.closest('.choice-row');
  const screen=btn.closest('.screen')||document;
  const card=btn.closest('.card');
  row.classList.add('no-fixed');
  const cardRect=card.getBoundingClientRect();
  const w=btn.offsetWidth||120, h=btn.offsetHeight||52;
  const pad=14;
  const roam=70; // how far it may wander above/left/right of the card — free everywhere but down
  const bottomInset=8; // the ONE hard rule: never crosses below the card's own bottom edge

  // Card-local bounds (0,0 = card's top-left corner).
  let minX=-roam;
  let maxX=cardRect.width+roam-w;
  let minY=-roam;
  let maxY=cardRect.height-bottomInset-h;
  // Extra safety: never push it fully off the visible screen either.
  minX=Math.max(minX, -cardRect.left+pad);
  maxX=Math.min(maxX, window.innerWidth-cardRect.left-w-pad);
  minY=Math.max(minY, -cardRect.top+pad);
  maxY=Math.min(maxY, window.innerHeight-cardRect.top-h-pad, maxY);
  if(maxX<minX){ const mid=(maxX+minX)/2; minX=maxX=mid; }
  if(maxY<minY){ const mid=(maxY+minY)/2; minY=maxY=mid; }

  // Every piece of text / visual content on the current screen that must stay clear,
  // converted into the same card-local coordinate space.
  const clearanceGap=10;
  const obstacles=[];
  function toCardLocal(r){ return {left:r.left-cardRect.left, right:r.right-cardRect.left, top:r.top-cardRect.top, bottom:r.bottom-cardRect.top}; }
  screen.querySelectorAll('h1,h2,h3,p,.eyebrow,.sticker,.dots').forEach(el=>{
    const r=el.getBoundingClientRect();
    if(r.width>0 || r.height>0) obstacles.push(toCardLocal(r));
  });
  row.querySelectorAll('.btn').forEach(other=>{
    if(other!==btn) obstacles.push(toCardLocal(other.getBoundingClientRect()));
  });
  function overlapArea(x,y){
    const L=x, R=x+w, T=y, B=y+h;
    let area=0;
    for(const o of obstacles){
      const ox=Math.min(R,o.right+clearanceGap)-Math.max(L,o.left-clearanceGap);
      const oy=Math.min(B,o.bottom+clearanceGap)-Math.max(T,o.top-clearanceGap);
      if(ox>0 && oy>0) area+=ox*oy;
    }
    return area;
  }

  // Try random spots first; keep the first one that touches nothing.
  let x=minX+Math.random()*(maxX-minX), y=minY+Math.random()*(maxY-minY), placed=false;
  for(let i=0;i<80;i++){
    const tx=minX+Math.random()*(maxX-minX);
    const ty=minY+Math.random()*(maxY-minY);
    if(overlapArea(tx,ty)===0){ x=tx; y=ty; placed=true; break; }
  }
  // Fallback: scan a grid and take whichever spot overlaps the least (should be rare).
  if(!placed){
    let bestArea=Infinity;
    for(let gx=0; gx<=8; gx++){
      for(let gy=0; gy<=8; gy++){
        const tx=minX+(maxX-minX)*(gx/8);
        const ty=minY+(maxY-minY)*(gy/8);
        const a=overlapArea(tx,ty);
        if(a<bestArea){ bestArea=a; x=tx; y=ty; }
      }
    }
  }
  btn.style.left=x+'px'; btn.style.top=y+'px';
}

// ---- Q1 ----
let noAttempts=0;
function onNo1(e){
  e.preventDefault(); noAttempts++;
  const seq=C.q1NoSequence;
  $('noBtn').textContent=seq[noAttempts % seq.length];
  $('noBtn').classList.add('wobble'); setTimeout(()=>$('noBtn').classList.remove('wobble'),400);
  $('yesBtn').style.zIndex=40;
  $('q1Sticker').textContent=['🤨','😂','😳','👀'][noAttempts%4];
  burst(['💗'],4);
}
function onYes1(){
  $('q2Reaction').innerHTML='';
  const box=document.createElement('p'); box.id='q1YesReactionShown'; box.textContent=C.q1YesReaction;
  $('screen-q1').querySelector('.card').appendChild(box);
  burst(['💗','💖','✨'],16);
  setTimeout(()=>{ box.remove(); showScreen('screen-q2'); },900);
}

// ---- Q2 friend/lover troll ----
let friendAttempts=0;
function onFriend(e){
  e.preventDefault(); friendAttempts++;
  const seq=C.q2FriendSequence;
  $('friendBtn').textContent=seq[friendAttempts % seq.length];
  $('friendBtn').classList.add('wobble'); setTimeout(()=>$('friendBtn').classList.remove('wobble'),400);
  $('loverBtn').style.zIndex=40;
  $('q2Sticker').textContent=['😂','🙈','😭','👀','😌'][friendAttempts%5];
  burst(['💗'],4);
  if(friendAttempts>=3){
    let nudge=$('impatientNudge');
    if(!nudge){ nudge=document.createElement('p'); nudge.id='impatientNudge'; $('q2Reaction').appendChild(nudge); }
    const list=C.q2ImpatientNudges;
    nudge.textContent=list[(friendAttempts-3) % list.length];
  }
  if(friendAttempts % seq.length===seq.length-1){
    const nudge=document.createElement('p'); nudge.textContent=C.q2FinalNudge;
    $('q2Reaction').appendChild(nudge);
  }
}
function onLover(){
  burst(['💗','🌸','✨','💕'],18);
  $('q2Row').style.display='none';
  setTimeout(()=>{
    showScreen('screen-transition');
    $('loveYouToo').classList.remove('show');
    $('birthdayIntro').style.display='none'; $('showMeBtn').style.display='none';
    setTimeout(()=>{ $('loveYouToo').classList.add('show'); burst(['💗','💕'],10); },1000);
    setTimeout(()=>{ $('birthdayIntro').style.display='block'; },2300);
    setTimeout(()=>{ $('showMeBtn').style.display='inline-block'; burst(['🎀','✨'],10); },3300);
  },700);
}
function revealBirthday(){ showScreen('screen-birthday'); startCountdown(); }

// ---- countdown ----
let cdTimer;
function startCountdown(){
  clearInterval(cdTimer);
  const target=new Date(C.birthday).getTime();
  function tick(){
    const diff=target-Date.now();
    if(diff<=0){
      clearInterval(cdTimer);
      $('countdown').style.display='none'; $('bArrived').style.display='block';
      $('birthdayNextBtn').textContent='Replay ↻';
      $('birthdayNextBtn').onclick=restart;
      burst(['🎂','💗','✨','🎉'],24);
      return;
    }
    $('cd-d').textContent=Math.floor(diff/86400000);
    $('cd-h').textContent=Math.floor(diff%86400000/3600000);
    $('cd-m').textContent=Math.floor(diff%3600000/60000);
    $('cd-s').textContent=Math.floor(diff%60000/1000);
  }
  tick(); cdTimer=setInterval(tick,1000);
}

// ---- photos ----
function buildPhotos(){
  const wall=$('photowall'); wall.innerHTML='';
  C.photos.forEach((src,i)=>{
    const d=document.createElement('div'); d.className='polaroid';
    const img=new Image();
    img.onload=()=>{ d.querySelector('img').src=src; };
    img.onerror=()=>{};
    img.src=src;
    d.innerHTML=`<img src="" alt="memory ${i+1}" onerror="this.style.background='radial-gradient(circle at 50% 35%,var(--blush),var(--cream))'; this.removeAttribute('src');"><div class="cap">${C.photoCaptions[i]||''}</div>`;
    wall.appendChild(d);
  });
}

// ---- letter ----
function openLetter(){
  $('envelope').classList.add('open'); $('openLetterBtn').style.display='none';
  burst(['🌸','💗','✨'],14);
  setTimeout(()=>$('letterPaper').classList.add('show'),400);
}

// ---- replay ----
function restart(){
  clearInterval(cdTimer);
  noAttempts=0; friendAttempts=0;
  ['noBtn','friendBtn'].forEach(id=>{
    $(id).style.opacity='1'; $(id).style.pointerEvents='auto'; $(id).style.left=''; $(id).style.top='';
    $(id).closest('.choice-row').classList.remove('no-fixed');
  });
  $('noBtn').textContent=C.q1NoSequence[0];
  $('friendBtn').textContent=C.q2FriendSequence[0];
  $('q2Row').style.display='flex'; $('q2Reaction').innerHTML='';
  $('countdown').style.display='flex'; $('bArrived').style.display='none';
  $('birthdayNextBtn').textContent='Continue →';
  $('birthdayNextBtn').onclick=function(){ showScreen('screen-photos'); buildPhotos(); };
  $('envelope').classList.remove('open'); $('letterPaper').classList.remove('show');
  $('loveYouToo').classList.remove('show');
  $('openLetterBtn').style.display='inline-block';
  showScreen('screen-opening');
}
</script>
</body>
</html>
